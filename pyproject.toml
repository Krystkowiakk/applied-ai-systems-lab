[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-ai-systems-lab"
version = "0.1.0"
description = "The techniques I use to build AI systems and tools, each on a runnable example from plant operations, industrial planning or software building."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Krystian Krystkowiak" }]
keywords = ["llm", "agents", "evaluation", "tool-use", "rag", "ai-engineering"]
dependencies = ["pydantic>=2.6", "pillow>=10.1"]

[project.optional-dependencies]
openai = ["openai>=3.35"]
anthropic = ["anthropic>=1.15"]
mcp = ["mcp>=2.3", "uvicorn>=0.30"]
service = ["fastapi>=0.110", "uvicorn>=0.30", "httpx>=0.27"]
all = ["openai>=3.35", "anthropic>=1.15", "mcp>=2.3", "fastapi>=0.110", "uvicorn>=0.30", "httpx>=0.27"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "mcp>=2.3", "fastapi>=0.110", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
aisyslab = "aisyslab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aisyslab = ["py.typed", "runtime/static/*.html", "runtime/processes/*/*.md", "voice/recorded/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
