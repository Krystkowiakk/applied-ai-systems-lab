<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance request service</title>
<style>
  :root {
    --navy: #1b2a4a; --accent: #d9822b; --ink: #1f2430; --muted: #6b7280; --line: #e3e6ec;
    --paper: #ffffff; --wash: #f5f6f8; --ok: #2f7d4f; --bad: #b3261e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); background: var(--wash); }
  header { display: flex; gap: 16px; align-items: center; padding: 12px 20px; background: var(--navy); color: #fff; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  header input { width: 260px; }
  #usage { font-size: 12px; opacity: .85; }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 20px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 12px 16px; } header input { width: 100%; } }
  section.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 8px; }
  input, select, textarea, button { font: inherit; }
  input, select, textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  textarea { min-height: 64px; resize: vertical; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  button { padding: 6px 12px; border: 1px solid var(--navy); border-radius: 6px; background: var(--navy); color: #fff; cursor: pointer; }
  button.quiet { background: #fff; color: var(--navy); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  ul.list { list-style: none; margin: 0; padding: 0; max-height: 40vh; overflow: auto; }
  ul.list li { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  ul.list li:hover, ul.list li.active { background: var(--wash); }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--wash); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  .badge.completed { color: var(--ok); border-color: var(--ok); }
  .badge.failed, .badge.cancelled { color: var(--bad); border-color: var(--bad); }
  .badge.running, .badge.waiting { color: var(--accent); border-color: var(--accent); }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .bar h2 { margin: 0; flex: 1; text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--ink); }
  .bar select { width: auto; }
  ol.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card .who { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .card.user { border-left: 3px solid var(--navy); }
  .card.tool { background: var(--wash); }
  .card.tool.error { border-left: 3px solid var(--bad); }
  .card.draft { border-style: dashed; color: var(--muted); }
  .card.ask { border-left: 3px solid var(--accent); }
  .text { white-space: pre-wrap; word-break: break-word; }
  .call { display: inline-block; font: 12px/1.4 Menlo, Consolas, monospace; background: var(--wash); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; margin: 2px 4px 2px 0; }
  pre { margin: 6px 0 0; font: 12px/1.4 Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  ol.events { font: 12px/1.5 Menlo, Consolas, monospace; color: var(--muted); max-height: 260px; overflow: auto; padding-left: 20px; }
  .muted { color: var(--muted); }
  .result { border-left: 3px solid var(--ok); }
  #composer { margin-top: 12px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Maintenance request service</h1>
  <span class="spacer"></span>
  <span id="usage"></span>
  <input id="token" type="password" placeholder="Bearer token" autocomplete="off" aria-label="Bearer token">
  <button id="use-token" class="quiet">Use token</button>
</header>
<main>
  <aside>
    <section class="panel">
      <h2>New request</h2>
      <label for="agent">Agent</label>
      <select id="agent"></select>
      <p id="agent-info" class="hint"></p>
      <label for="seed">Plant state (seed)</label>
      <input id="seed" type="number" min="0" value="0">
      <label for="first">Message</label>
      <textarea id="first" placeholder="Optional for agents with a standing task"></textarea>
      <div class="row"><button id="start">Start</button></div>
    </section>
    <section class="panel">
      <h2>Ticket triage</h2>
      <textarea id="ticket" placeholder="coolant pump 2: grinding noise at the drive end. line stopped."></textarea>
      <div class="row"><button id="triage" class="quiet">Classify</button></div>
      <div id="triage-out" class="hint"></div>
    </section>
    <section class="panel">
      <h2>Sessions</h2>
      <ul id="sessions" class="list"></ul>
    </section>
  </aside>
  <section>
    <div id="empty" class="panel muted">Enter a token, then start a request or open a session.</div>
    <div id="session" hidden>
      <div class="bar">
        <h2 id="title"></h2>
        <select id="threads" aria-label="Branch"></select>
        <span id="status" class="badge"></span>
        <button id="cancel" class="quiet">Cancel run</button>
      </div>
      <ol id="items" class="items"></ol>
      <div id="draft" class="card draft text" hidden></div>
      <div id="ask" class="card ask" hidden>
        <div class="who"><span>The agent asks</span></div>
        <div id="question" class="text"></div>
        <div class="row"><input id="answer" placeholder="Your answer"><button id="send-answer">Answer</button></div>
      </div>
      <form id="composer">
        <textarea id="message" placeholder="Message. Sent while the agent works, it waits in the thread's queue."></textarea>
        <div class="row"><button>Send</button><span id="compose-note" class="hint"></span></div>
      </form>
      <details class="panel"><summary>Event stream</summary><ol id="events" class="events"></ol></details>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const state = { token: "", session: null, thread: null, run: null, stream: null };
try { state.token = localStorage.getItem("service-token") || ""; } catch (_) {}
$("token").value = state.token;

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children) if (child != null) node.append(child);
  return node;
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { Authorization: `Bearer ${state.token}`, "Content-Type": "application/json", ...(options.headers || {}) },
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(typeof body.detail === "string" ? body.detail : res.statusText);
  }
  return res.json();
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const ACTIVE = ["pending", "running", "waiting"];
const pretty = (text) => { try { return JSON.stringify(JSON.parse(text), null, 2); } catch (_) { return text; } };

async function boot() {
  if (!state.token) return;
  try {
    const agents = await api("/v1/agents");
    $("agent").replaceChildren(...agents.map((a) => el("option", { value: a.name }, a.name)));
    $("agent").onchange = () => {
      const a = agents.find((x) => x.name === $("agent").value);
      $("agent-info").textContent = a ? a.description + (a.standing_task ? " Has a standing task." : "") : "";
    };
    $("agent").onchange();
    await Promise.all([loadSessions(), loadUsage()]);
    $("empty").textContent = "Start a request or open a session.";
  } catch (err) {
    $("empty").textContent = `Could not connect: ${err.message}`;
  }
}

async function loadUsage() {
  const u = await api("/v1/usage");
  $("usage").textContent = `${u.tenant}: ${u.tokens_used.toLocaleString()} / ${u.token_budget.toLocaleString()} tokens`;
}

async function loadSessions() {
  const sessions = await api("/v1/sessions");
  $("sessions").replaceChildren(...sessions.map((s) =>
    el("li", { class: state.session === s.id ? "active" : "", onclick: () => openSession(s.id) },
      el("span", {}, s.title), el("span", { class: `badge ${s.last_status || ""}` }, s.last_status || "-"))));
}

async function openSession(sessionId, threadId) {
  state.session = sessionId;
  const s = await api(`/v1/sessions/${sessionId}`);
  $("empty").hidden = true;
  $("session").hidden = false;
  $("title").textContent = s.title === s.agent ? s.agent : `${s.title} · ${s.agent}`;
  state.thread = threadId || state.thread && s.threads.some((t) => t.id === state.thread) && state.thread || s.threads[0].id;
  $("threads").replaceChildren(...s.threads.map((t, i) =>
    el("option", { value: t.id }, i === 0 ? "main thread" : `branch ${i} (from item ${t.fork_seq})`)));
  $("threads").value = state.thread;
  const runs = s.runs.filter((r) => r.thread_id === state.thread);
  const latest = runs.find((r) => ACTIVE.includes(r.status)) || runs[runs.length - 1];
  state.run = latest ? latest.id : null;
  await renderThread();
  if (latest && ACTIVE.includes(latest.status)) follow(latest.id);
  loadSessions();
}

async function renderThread() {
  const items = await api(`/v1/threads/${state.thread}/items`);
  $("items").replaceChildren(...items.map(renderItem));
  if (!state.run) return;
  const run = await api(`/v1/runs/${state.run}`);
  $("status").textContent = run.status;
  $("status").className = `badge ${run.status}`;
  $("cancel").disabled = ["completed", "failed", "cancelled"].includes(run.status);
  $("ask").hidden = !run.questions.length;
  if (run.questions.length) $("question").textContent = run.questions[0].question;
  if (run.result || run.error) $("items").append(renderResult(run));
}

function renderItem(item) {
  const d = item.data;
  if (item.kind === "user") {
    return el("li", { class: "card user" },
      el("div", { class: "who" }, el("span", {}, `#${item.seq} request`),
        el("button", { class: "quiet", title: "Branch before this message and write it again",
          onclick: () => editFrom(item) }, "Edit from here")),
      el("div", { class: "text" }, d.text));
  }
  if (item.kind === "assistant") {
    return el("li", { class: "card" },
      el("div", { class: "who" }, el("span", {}, `#${item.seq} ${d.model || "model"}`),
        el("span", {}, `${d.usage.input_tokens} in · ${d.usage.output_tokens} out`)),
      d.text ? el("div", { class: "text" }, d.text) : null,
      ...d.tool_calls.map((c) => el("span", { class: "call" }, `${c.name}(${JSON.stringify(c.arguments)})`)));
  }
  return el("li", { class: `card tool${d.is_error ? " error" : ""}` },
    el("details", {}, el("summary", {}, `#${item.seq} ${d.name} ${d.is_error ? "error" : "result"}`),
      el("pre", {}, pretty(d.content))));
}

function renderResult(run) {
  // The answer itself is the last model turn above; this card adds what the turn cannot say.
  const r = run.result || {};
  const verified = r.verified === true ? "verified by its check" : r.verified === false ? "not verified by its check" : "";
  return el("li", { class: "card result" },
    el("div", { class: "who" }, el("span", {}, `Run ${run.status}`), el("span", {}, verified)),
    r.answer ? el("pre", {}, `Submitted ${r.answer.tool} ${JSON.stringify(r.answer.arguments, null, 2)}`) : null,
    run.error ? el("div", { class: "text" }, run.error) : null);
}

async function editFrom(item) {
  const { thread_id } = await api(`/v1/threads/${state.thread}/branch`, {
    method: "POST", body: JSON.stringify({ keep_until: item.seq - 1 }) });
  state.thread = thread_id;
  state.run = null;
  await openSession(state.session, thread_id);
  $("message").value = item.data.text;
  $("message").focus();
  $("compose-note").textContent = "New branch: the original thread is kept.";
}

function logEvent(event) {
  const who = event.agent ? `[${event.agent}] ` : "";
  $("events").append(el("li", {}, `${event.id} ${who}${event.kind} ${JSON.stringify(event.data).slice(0, 160)}`));
  $("events").scrollTop = $("events").scrollHeight;
}

let refreshTimer = null;
function refreshSoon() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => { renderThread(); loadUsage(); loadSessions(); }, 150);
}

function onEvent(type, event) {
  logEvent(event);
  if (event.run_id !== state.run) { if (type === "child_finished") refreshSoon(); return; }
  if (type === "text_delta") {
    $("draft").hidden = false;
    $("draft").textContent += event.data.text;
    return;
  }
  if (type === "stream_reset") { $("draft").textContent = ""; return; }
  if (["generation", "tool", "waiting", "resumed", "completed", "failed", "cancelled", "run_dequeued", "postponed", "recovered"].includes(type)) {
    if (type === "generation") { $("draft").textContent = ""; $("draft").hidden = true; }
    refreshSoon();
  }
}

function parseChunk(chunk) {
  let id = null, type = "message", data = "";
  for (const line of chunk.split("\n")) {
    if (!line || line.startsWith(":")) continue;
    const cut = line.indexOf(":");
    const key = line.slice(0, cut), value = line.slice(cut + 1).replace(/^ /, "");
    if (key === "id") id = value; else if (key === "event") type = value; else if (key === "data") data += value;
  }
  return data ? { id, type, data: JSON.parse(data) } : null;
}

async function follow(runId) {
  if (state.stream) state.stream.abort();
  const controller = new AbortController();
  state.stream = controller;
  $("events").replaceChildren();
  let last = 0, ended = false;
  while (!ended && !controller.signal.aborted) {
    try {
      const res = await fetch(`/v1/runs/${runId}/events`, {
        headers: { Authorization: `Bearer ${state.token}`, "Last-Event-ID": String(last) }, signal: controller.signal });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let cut;
        while ((cut = buffer.indexOf("\n\n")) >= 0) {
          const message = parseChunk(buffer.slice(0, cut));
          buffer = buffer.slice(cut + 2);
          if (!message) continue;
          if (message.type === "end") { ended = true; break; }
          if (message.id) last = Number(message.id);
          onEvent(message.type, message.data);
        }
        if (ended) break;
      }
    } catch (_) {
      if (controller.signal.aborted) return;
    }
    if (!ended) await sleep(1000); // reconnect; Last-Event-ID resumes after the last event seen
  }
  if (state.stream === controller) openSession(state.session, state.thread); // a queued message may start now
}

$("use-token").onclick = () => {
  state.token = $("token").value.trim();
  try { localStorage.setItem("service-token", state.token); } catch (_) {}
  boot();
};

$("start").onclick = async () => {
  try {
    const out = await api("/v1/sessions", { method: "POST", body: JSON.stringify({
      agent: $("agent").value, message: $("first").value, seed: Number($("seed").value || 0) }) });
    $("first").value = "";
    state.thread = out.thread_id;
    await openSession(out.session_id, out.thread_id);
  } catch (err) { alert(err.message); }
};

$("composer").onsubmit = async (event) => {
  event.preventDefault();
  const text = $("message").value.trim();
  if (!text) return;
  try {
    const run = await api(`/v1/threads/${state.thread}/messages`, { method: "POST", body: JSON.stringify({ text }) });
    $("message").value = "";
    $("compose-note").textContent = run.status === "queued" ? "Queued: it starts when the current run ends." : "";
    if (run.status !== "queued") { state.run = run.id; follow(run.id); }
    refreshSoon();
  } catch (err) { alert(err.message); }
};

$("send-answer").onclick = async () => {
  try {
    await api(`/v1/runs/${state.run}/answer`, { method: "POST", body: JSON.stringify({ text: $("answer").value }) });
    $("answer").value = "";
    $("ask").hidden = true;
  } catch (err) { alert(err.message); }
};

$("cancel").onclick = async () => {
  if (state.run) await api(`/v1/runs/${state.run}/cancel`, { method: "POST" }).catch((err) => alert(err.message));
  refreshSoon();
};

$("threads").onchange = () => openSession(state.session, $("threads").value);

$("triage").onclick = async () => {
  try {
    const t = await api("/v1/triage", { method: "POST", body: JSON.stringify({ text: $("ticket").value }) });
    $("triage-out").textContent = `${t.code || "unclassified"}, priority ${t.priority}. ${t.reason}` +
      (t.degraded ? ` Degraded: ${t.note}` : ` (${t.model})`);
  } catch (err) { $("triage-out").textContent = err.message; }
};

boot();
</script>
</body>
</html>
